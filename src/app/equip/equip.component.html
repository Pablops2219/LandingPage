<div class="team-container">
  <div class="team-header">
    <h2 class="section-title">El nostre <span>equip</span></h2>
    <p class="section-subtitle">Persones compromeses amb el futur de la Universitat.</p>
  </div>

  <div class="team-grid">
    <div class="team-card" *ngFor="let member of teamItems">
      <div class="image-wrapper">
        <div class="bg-blur-circle" [style.background-color]="member.color"></div>
        <img [src]="member.photo" [alt]="member.name" class="member-photo">
      </div>
      
      <div class="member-info">
        <h3 class="member-name">{{ member.name }}</h3>
        <p class="member-role">{{ member.role }}</p>
        <div class="member-bio">{{ member.bio }}</div>
        
        <div class="member-social">
          <a *ngIf="member.linkedin" [href]="member.linkedin" target="_blank"><i class="fab fa-linkedin"></i></a>
          <a *ngIf="member.email" [href]="'mailto:' + member.email"><i class="fas fa-envelope"></i></a>
        </div>
      </div>
    </div>
  </div>
</div>
